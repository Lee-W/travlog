$schema: "https://json-schema.org/draft/2020-12/schema"
title: Root place fields
description: >
  Shared display hints for root-level place YAML files such as restaurant.yaml
  and other.yaml. Keep this schema permissive because it is inherited by every
  YAML file directly under content/places/.
type: object
additionalProperties: true
properties:
  locations:
    type: array
    items:
      type: object
      additionalProperties: true
      required: [name, lat, lon]
      properties:
        id:
          type: string
          x-osm-list-hidden: true
        name:
          type: string
          title: 地點
          x-osm-list-i18n:
            title:
              en: Place
              ja: 場所
        icon:
          type: string
          title: 圖示
          x-osm-list-hidden: true
          x-osm-list-i18n:
            title:
              en: Icon
        place_type:
          # 與 pilgrimage/ 及 travel/ 一致的「類型 → emoji」集中對照。
          # restaurant.yaml 與 other.yaml 沿用逐筆 `icon`，兩者可並存
          # （`icon` 為顯式指定，place_type 為依類型推導）。
          type: string
          title: 類型
          x-osm-list-hidden: true
          x-osm-icon:
            Livehouse: 🎸
            展演空間: 🎤
            體育館: 🏟️
            巨蛋: 🏟️
            展覽館: 🏢
            會議場: 🏢
            劇場: 🎭
            音樂廳: 🎻
            戲曲中心: 🎎
            公園: 🌳
            藝廊: 🖼️
            酒吧: 🍸
            書店: 📖
          x-osm-list-i18n:
            title:
              en: Type
              ja: 種別
        rating:
          type: number
          title: 喜好程度
          minimum: 1
          maximum: 5
        lat:
          type: number
          minimum: -90
          maximum: 90
          x-osm-list-hidden: true
        lon:
          type: number
          minimum: -180
          maximum: 180
          x-osm-list-hidden: true
        country:
          type: string
          title: 國家
          x-osm-list-i18n:
            title:
              en: Country
              ja: 国
        city:
          type: string
          title: 縣市
          x-osm-list-i18n:
            title:
              en: City
              ja: 都市
        district:
          type: string
          title: 行政區
          x-osm-list-i18n:
            title:
              en: District
              ja: 区域
        date:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
          title: 日期
          x-osm-list-sort: max
          x-osm-list-i18n:
            title:
              en: Date
              ja: 日付
        status:
          type: string
          title: 狀態
          x-osm-list-i18n:
            title:
              en: Status
              ja: 状態
        closed_date:
          type: string
          title: 歇業時間
          x-osm-list-i18n:
            title:
              en: Closed
              ja: 閉店時期
        visit_note:
          type: string
          title: 造訪備註
          x-osm-list-i18n:
            title:
              en: Visit note
        address:
          type: string
          title: 地址
          x-osm-list-hidden: true
          x-osm-list-i18n:
            title:
              en: Address
              ja: 住所
        tags:
          type: array
          items:
            type: string
        urls:
          type: array
          items:
            type: object
            properties:
              label:
                type: string
              href:
                type: string
