$schema: "https://json-schema.org/draft/2020-12/schema"
title: Root place fields
description: >
  Shared display hints for root-level place YAML files — currently only
  other.yaml. Keep this schema permissive because it is inherited by every
  YAML file directly under content/places/.
  餐廳、場館、旅遊、電影院都已改為「一個子目錄一類、一個檔案一個國家」，
  各自有自己的 _schema.yaml；只剩雜項地點還留在根層級。
  引用 ./_common.yaml 的 field_id / field_personal_curation / field_city /
  field_visit_status_and_lists / field_address 五組共用欄位（id、圖示評分、
  縣市、日期狀態標籤網址、地址）；name/lat(hidden)/lon(hidden)/
  country(not hidden)/district(not hidden) 因 title 或 x-osm-list-hidden 隨
  領域而異，在此完整覆寫；place_type 是雜項地點專用的 x-osm-icon 對照表。
type: object
additionalProperties: true
properties:
  locations:
    type: array
    items:
      type: object
      additionalProperties: true
      required: [name, lat, lon]
      allOf:
        - $ref: "./_common.yaml#/$defs/field_id"
        - $ref: "./_common.yaml#/$defs/field_personal_curation"
        - $ref: "./_common.yaml#/$defs/field_city"
        - $ref: "./_common.yaml#/$defs/field_visit_status_and_lists"
        - $ref: "./_common.yaml#/$defs/field_address"
        - $ref: "./_common.yaml#/$defs/field_osm_ref"
      properties:
        name:
          type: string
          title: 地點
          x-osm-list-i18n:
            title:
              en: Place
              ja: 場所
        place_type:
          # 與 pilgrimage/ 及 travel/ 一致的「類型 → emoji」集中對照。
          # restaurant.yaml 與 other.yaml 沿用逐筆 `icon`，兩者可並存
          # （`icon` 為顯式指定，place_type 為依類型推導）。
          type: string
          title: 類型
          x-osm-list-hidden: true
          x-osm-icon:
            Livehouse: 🎸
            展演空間: 🎤
            體育館: 🏟️
            巨蛋: 🏟️
            展覽館: 🏢
            會議場: 🏢
            劇場: 🎭
            音樂廳: 🎻
            戲曲中心: 🎎
            公園: 🌳
            藝廊: 🖼️
            酒吧: 🍸
            書店: 📖
          x-osm-list-i18n:
            title:
              en: Type
              ja: 種別
        lat:
          type: number
          minimum: -90
          maximum: 90
          x-osm-list-hidden: true
        lon:
          type: number
          minimum: -180
          maximum: 180
          x-osm-list-hidden: true
        country:
          type: string
          title: 國家
          x-osm-list-i18n:
            title:
              en: Country
              ja: 国
        district:
          type: string
          title: 行政區
          x-osm-list-i18n:
            title:
              en: District
              ja: 区域
