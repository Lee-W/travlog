$schema: "https://json-schema.org/draft/2020-12/schema"
title: Root place fields
description: >
  Shared display hints for root-level place YAML files such as restaurant.yaml
  and other.yaml. Keep this schema permissive because it is inherited by every
  YAML file directly under content/places/.
type: object
additionalProperties: true
properties:
  locations:
    type: array
    items:
      type: object
      additionalProperties: true
      required: [name, lat, lon]
      properties:
        id:
          type: string
          x-osm-list-hidden: true
        name:
          type: string
          title: 地點
          x-osm-list-i18n:
            title:
              en: Place
              ja: 場所
        icon:
          type: string
          title: 圖示
          x-osm-list-hidden: true
          x-osm-list-i18n:
            title:
              en: Icon
        rating:
          type: number
          title: 喜好程度
          minimum: 1
          maximum: 5
        lat:
          type: number
          minimum: -90
          maximum: 90
          x-osm-list-hidden: true
        lon:
          type: number
          minimum: -180
          maximum: 180
          x-osm-list-hidden: true
        city:
          type: string
          title: 縣市
          x-osm-list-i18n:
            title:
              en: City
              ja: 都市
        district:
          type: string
          title: 行政區
          x-osm-list-i18n:
            title:
              en: District
              ja: 区域
        status:
          type: string
          title: 狀態
          x-osm-list-i18n:
            title:
              en: Status
              ja: 状態
        closed_date:
          type: string
          title: 歇業時間
          x-osm-list-i18n:
            title:
              en: Closed
              ja: 閉店時期
        visit_note:
          type: string
          title: 造訪備註
          x-osm-list-i18n:
            title:
              en: Visit note
        address:
          type: string
          title: 地址
          x-osm-list-hidden: true
          x-osm-list-i18n:
            title:
              en: Address
              ja: 住所
        tags:
          type: array
          items:
            type: string
        urls:
          type: array
          items:
            type: object
            properties:
              label:
                type: string
              href:
                type: string
