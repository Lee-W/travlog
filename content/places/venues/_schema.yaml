$schema: "https://json-schema.org/draft/2020-12/schema"
title: Venue locations
description: >
  演唱會與舞台表演的場館。locations-based 形式：top-level 為檔案層 metadata
  （合併進每筆 location），locations 為地點清單。**一個檔案 = 一個國家**，
  與 travel/、restaurant/、theaters/ 的組織方式一致。

  演出紀錄本身在 content/data/concerts.yaml 與 stage-performances.yaml，
  那兩個檔的 venue 欄位只是顯示字串（場館名 ＋ OSM 連結），本目錄才是場館的地點資料。
  引用 ../_common.yaml 的 field_id / field_city / field_visit_status_and_lists /
  field_address 四組共用欄位（沒有 field_personal_curation——場館沒有逐筆評分
  或造訪心得的概念）；name/lat(hidden)/lon(hidden)/district(not hidden) 因
  title 或 x-osm-list-hidden 隨領域而異，在此完整覆寫；place_type 是場館專用的
  x-osm-icon 對照表（比根層級少「藝廊／酒吧／書店」三類，因為場館用不到）。
type: object
required: [locations]
properties:

  # ── File-level metadata (merged into every location) ───────────────────
  country:
    # 一個檔案一個國家，頁面已用 H2 標示，故不重複佔一欄；
    # 仍會進 geojson properties，資料沒有少
    type: string
    title: 國家
    x-osm-list-hidden: true
    x-osm-list-i18n:
      title:
        en: Country
        ja: 国
  tags:
    type: array
    items:
      type: string

  # ── Per-place rows ─────────────────────────────────────────────────────
  locations:
    type: array
    items:
      type: object
      required: [name, lat, lon]
      allOf:
        - $ref: "../_common.yaml#/$defs/field_id"
        - $ref: "../_common.yaml#/$defs/field_city"
        - $ref: "../_common.yaml#/$defs/field_visit_status_and_lists"
        - $ref: "../_common.yaml#/$defs/field_address"
        - $ref: "../_common.yaml#/$defs/field_osm_ref"
      properties:
        name:
          type: string
          title: 場館
          x-osm-list-i18n:
            title:
              en: Venue
              ja: 会場
        place_type:
          type: string
          title: 類型
          x-osm-list-hidden: true
          x-osm-icon:
            Livehouse: 🎸
            展演空間: 🎤
            體育館: 🏟️
            巨蛋: 🏟️
            展覽館: 🏢
            會議場: 🏢
            劇場: 🎭
            音樂廳: 🎻
            戲曲中心: 🎎
            公園: 🌳
          x-osm-list-i18n:
            title:
              en: Type
              ja: 種別
        lat:
          type: number
          minimum: -90
          maximum: 90
          x-osm-list-hidden: true
        lon:
          type: number
          minimum: -180
          maximum: 180
          x-osm-list-hidden: true
        district:
          type: string
          title: 行政區
          x-osm-list-i18n:
            title:
              en: District
              ja: 区域
