$schema: "https://json-schema.org/draft/2020-12/schema"
title: Venue locations
description: >
  演唱會與舞台表演的場館。locations-based 形式：top-level 為檔案層 metadata
  （合併進每筆 location），locations 為地點清單。**一個檔案 = 一個國家**，
  與 travel/、restaurant/、theaters/ 的組織方式一致。

  演出紀錄本身在 content/data/concerts.yaml 與 stage-performances.yaml，
  那兩個檔的 venue 欄位只是顯示字串（場館名 ＋ OSM 連結），本目錄才是場館的地點資料。
type: object
required: [locations]
properties:

  # ── File-level metadata (merged into every location) ───────────────────
  country:
    # 一個檔案一個國家，頁面已用 H2 標示，故不重複佔一欄；
    # 仍會進 geojson properties，資料沒有少
    type: string
    title: 國家
    x-osm-list-hidden: true
    x-osm-list-i18n:
      title:
        en: Country
        ja: 国
  tags:
    type: array
    items:
      type: string

  # ── Per-place rows ─────────────────────────────────────────────────────
  locations:
    type: array
    items:
      type: object
      required: [name, lat, lon]
      properties:
        id:
          type: string
          x-osm-list-hidden: true
        name:
          type: string
          title: 場館
          x-osm-list-i18n:
            title:
              en: Venue
              ja: 会場
        place_type:
          type: string
          title: 類型
          x-osm-list-hidden: true
          x-osm-icon:
            Livehouse: 🎸
            展演空間: 🎤
            體育館: 🏟️
            巨蛋: 🏟️
            展覽館: 🏢
            會議場: 🏢
            劇場: 🎭
            音樂廳: 🎻
            戲曲中心: 🎎
            公園: 🌳
          x-osm-list-i18n:
            title:
              en: Type
              ja: 種別
        lat:
          type: number
          minimum: -90
          maximum: 90
          x-osm-list-hidden: true
        lon:
          type: number
          minimum: -180
          maximum: 180
          x-osm-list-hidden: true
        city:
          type: string
          title: 縣市
          x-osm-list-i18n:
            title:
              en: City
              ja: 都市
        district:
          type: string
          title: 行政區
          x-osm-list-i18n:
            title:
              en: District
              ja: 区域
        date:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
          title: 日期
          x-osm-list-sort: max
          x-osm-list-i18n:
            title:
              en: Date
              ja: 日付
        status:
          type: string
          title: 狀態
          x-osm-list-i18n:
            title:
              en: Status
              ja: 状態
        closed_date:
          type: string
          title: 歇業時間
          x-osm-list-i18n:
            title:
              en: Closed
              ja: 閉店時期
        address:
          type: string
          title: 地址
          x-osm-list-hidden: true
          x-osm-list-i18n:
            title:
              en: Address
              ja: 住所
        tags:
          type: array
          items:
            type: string
        urls:
          type: array
          items:
            type: object
            properties:
              label:
                type: string
              href:
                type: string
