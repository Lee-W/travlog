$schema: "https://json-schema.org/draft/2020-12/schema"
title: Travel locations
description: >
  旅遊紀錄地點。locations-based 形式：top-level 為檔案層 metadata（合併進每筆 location），
  locations 為地點清單。**一個檔案 = 一個國家**，不是一趟旅程——目的是自持「去過的地方」
  資料庫，日後查詢是「東京那家店」而非「那是哪一趟」，所以依地理組織、不依敘事組織。
  旅程脈絡改由每筆 location 的 `trip` 欄位保留，該欄位同時兼任地圖圖層
  （`x-osm-map-layer` 是依欄位名從合併後的 schema 解析的，檔案層或 location 層皆可）。
  同一地點多次造訪合併成一筆、`date` 用陣列，不因分屬不同趟次而重複建檔。
  引用 ../_common.yaml 的 field_city / field_visit_status_and_lists /
  field_address / field_notes_and_images 四組共用欄位（沒有 field_id 或
  field_personal_curation——旅遊地點不需要逐店 id 或評分）；
  name/lat(not hidden)/lon(not hidden)/country(hidden)/district(hidden) 因
  title 或 x-osm-list-hidden 隨領域而異，在此完整覆寫；trip/place_type 為
  旅遊專有欄位。
type: object
required: [locations]
properties:

  # ── File-level metadata (merged into every location) ───────────────────
  country:
    # 一個檔案一個國家，頁面已用 H2 標示，故不重複佔一欄；
    # 仍會進 geojson properties，資料沒有少
    type: string
    title: 國家
    x-osm-list-hidden: true
    x-osm-list-i18n:
      title:
        en: Country
        ja: 国
  tags:
    type: array
    items:
      type: string

  # ── Per-place rows ─────────────────────────────────────────────────────
  locations:
    type: array
    items:
      type: object
      required: [name, lat, lon]
      allOf:
        - $ref: "../_common.yaml#/$defs/field_city"
        - $ref: "../_common.yaml#/$defs/field_visit_status_and_lists"
        - $ref: "../_common.yaml#/$defs/field_address"
        - $ref: "../_common.yaml#/$defs/field_notes_and_images"
        - $ref: "../_common.yaml#/$defs/field_osm_ref"
      properties:
        name:
          type: string
          title: 地點
          x-osm-list-i18n:
            title:
              en: Place
              ja: 場所
        trip:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
          title: 行程
          x-osm-map-layer: true
          x-osm-list-i18n:
            title:
              en: Trip
              ja: 旅程
        place_type:
          type: string
          title: 類型
          x-osm-list-hidden: true
          x-osm-icon:
            神社: ⛩️
            寺院: 🛕
            教堂: ⛪
            車站: 🚉
            機場: ✈️
            學校: 🏫
            城: 🏯
            橋: 🌉
            水族館: 🐟
            動物園: 🦁
            博物館: 🏛️
            美術館: 🖼️
            劇場: 🎭
            圖書館: 📚
            露營地: 🏕️
            住宿: 🏨
            溫泉: ♨️
            展望台: 🔭
            海岸: 🏖️
            公園: 🌳
            塔: 🗼
            球場: 🏟️
            主題樂園: 🎢
            商店街: 🛍️
            百貨: 🏬
            餐廳: 🍽️
            咖啡廳: ☕
            酒吧: 🍸
            書店: 📖
          x-osm-list-i18n:
            title:
              en: Type
              ja: 種別
        lat:
          type: number
          minimum: -90
          maximum: 90
        lon:
          type: number
          minimum: -180
          maximum: 180
        country:
          # 只在極少數需要覆蓋檔案層的情況下才逐筆填；
          # 這裡也要標 hidden，否則 location 層定義會蓋掉檔案層的 hidden
          type: string
          title: 國家
          x-osm-list-hidden: true
          x-osm-list-i18n:
            title:
              en: Country
              ja: 国
        district:
          type: string
          title: 行政區
          x-osm-list-hidden: true
          x-osm-list-i18n:
            title:
              en: District
              ja: 区域
