$schema: "https://json-schema.org/draft/2020-12/schema"
title: Restaurant locations
description: >
  去過的餐廳。locations-based 形式：top-level 為檔案層 metadata（合併進每筆 location），
  locations 為地點清單。**一個檔案 = 一個國家**，與 travel/ 及 theaters/ 的組織方式一致。
  country 提到檔案層，就不必逐筆填。
  rating 是選填：有評分代表「還想不想再去」的個人策展，旅途中一次性的店留空即可——
  完整性優先於策展，漏收地點比評分留空嚴重。
type: object
required: [locations]
properties:

  # ── File-level metadata (merged into every location) ───────────────────
  country:
    # 一個檔案一個國家，頁面已用 H2 標示，故不重複佔一欄；
    # 仍會進 geojson properties，資料沒有少
    type: string
    title: 國家
    x-osm-list-hidden: true
    x-osm-list-i18n:
      title:
        en: Country
        ja: 国
  tags:
    type: array
    items:
      type: string

  # ── Per-place rows ─────────────────────────────────────────────────────
  locations:
    type: array
    items:
      type: object
      required: [name, lat, lon]
      properties:
        id:
          type: string
          x-osm-list-hidden: true
        name:
          type: string
          title: 地點
          x-osm-list-i18n:
            title:
              en: Place
              ja: 場所
        icon:
          type: string
          title: 圖示
          x-osm-list-hidden: true
          x-osm-list-i18n:
            title:
              en: Icon
        rating:
          type: number
          title: 喜好程度
          minimum: 1
          maximum: 5
        lat:
          type: number
          minimum: -90
          maximum: 90
          x-osm-list-hidden: true
        lon:
          type: number
          minimum: -180
          maximum: 180
          x-osm-list-hidden: true
        city:
          type: string
          title: 縣市
          x-osm-list-i18n:
            title:
              en: City
              ja: 都市
        district:
          type: string
          title: 行政區
          x-osm-list-i18n:
            title:
              en: District
              ja: 区域
        date:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
          title: 日期
          x-osm-list-sort: max
          x-osm-list-i18n:
            title:
              en: Date
              ja: 日付
        status:
          type: string
          title: 狀態
          x-osm-list-i18n:
            title:
              en: Status
              ja: 状態
        closed_date:
          type: string
          title: 歇業時間
          x-osm-list-i18n:
            title:
              en: Closed
              ja: 閉店時期
        visit_note:
          type: string
          title: 造訪備註
          x-osm-list-i18n:
            title:
              en: Visit note
        address:
          type: string
          title: 地址
          x-osm-list-hidden: true
          x-osm-list-i18n:
            title:
              en: Address
              ja: 住所
        tags:
          type: array
          items:
            type: string
        urls:
          type: array
          items:
            type: object
            properties:
              label:
                type: string
              href:
                type: string
