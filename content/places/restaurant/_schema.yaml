$schema: "https://json-schema.org/draft/2020-12/schema"
title: Restaurant locations
description: >
  去過的餐廳。locations-based 形式：top-level 為檔案層 metadata（合併進每筆 location），
  locations 為地點清單。**一個檔案 = 一個國家**，與 travel/ 及 theaters/ 的組織方式一致。
  country 提到檔案層，就不必逐筆填。
  rating 是選填：有評分代表「還想不想再去」的個人策展，旅途中一次性的店留空即可——
  完整性優先於策展，漏收地點比評分留空嚴重。
  引用 ../_common.yaml 的 field_id / field_personal_curation / field_city /
  field_visit_status_and_lists / field_address 五組共用欄位（與根層級
  _schema.yaml 相同組合）；name/lat(hidden)/lon(hidden)/district(not hidden)
  因 title 或 x-osm-list-hidden 隨領域而異，在此完整覆寫。
type: object
required: [locations]
properties:

  # ── File-level metadata (merged into every location) ───────────────────
  country:
    # 一個檔案一個國家，頁面已用 H2 標示，故不重複佔一欄；
    # 仍會進 geojson properties，資料沒有少
    type: string
    title: 國家
    x-osm-list-hidden: true
    x-osm-list-i18n:
      title:
        en: Country
        ja: 国
  tags:
    type: array
    items:
      type: string

  # ── Per-place rows ─────────────────────────────────────────────────────
  locations:
    type: array
    items:
      type: object
      required: [name, lat, lon]
      allOf:
        - $ref: "../_common.yaml#/$defs/field_id"
        - $ref: "../_common.yaml#/$defs/field_personal_curation"
        - $ref: "../_common.yaml#/$defs/field_city"
        - $ref: "../_common.yaml#/$defs/field_visit_status_and_lists"
        - $ref: "../_common.yaml#/$defs/field_address"
      properties:
        name:
          type: string
          title: 地點
          x-osm-list-i18n:
            title:
              en: Place
              ja: 場所
        lat:
          type: number
          minimum: -90
          maximum: 90
          x-osm-list-hidden: true
        lon:
          type: number
          minimum: -180
          maximum: 180
          x-osm-list-hidden: true
        district:
          type: string
          title: 行政區
          x-osm-list-i18n:
            title:
              en: District
              ja: 区域
