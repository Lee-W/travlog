$schema: "https://json-schema.org/draft/2020-12/schema"
title: Pilgrimage locations
description: >
  動漫聖地巡禮。locations-based 形式：top-level 為檔案層 metadata（合併進每筆 location），
  locations 為地點清單。Property order mirrors current column display order
  (group_by="work,country,city" group_summary_at="work") — reorder freely.
  引用 ../_common.yaml 的 field_city / field_visit_status_and_lists /
  field_notes_and_images 三組共用欄位（沒有 field_id / field_personal_curation
  / field_address——聖地巡禮地點不記門牌地址，也沒有逐店 id 或評分）；
  name/lat(not hidden)/lon(not hidden)/country(not hidden) 因 title 或
  x-osm-list-hidden 隨領域而異，在此完整覆寫；work/place_type 為聖地巡禮專有
  （place_type 的 x-osm-icon 對照表與 pilgrimage-wishlist/ 共用同一份內容，
  但因分屬不同檔案、各自維護一份定義，非透過 $ref）。
type: object
required: [locations]
properties:

  # ── File-level metadata (merged into every location) ───────────────────
  work:
    type: string
    title: 作品
    x-osm-map-layer: true
    x-osm-list-i18n:
      title:
        en: Work
        ja: 作品
  tags:
    type: array
    items:
      type: string

  # ── Per-place rows ─────────────────────────────────────────────────────
  locations:
    type: array
    items:
      type: object
      required: [name, lat, lon]
      allOf:
        - $ref: "../_common.yaml#/$defs/field_city"
        - $ref: "../_common.yaml#/$defs/field_visit_status_and_lists"
        - $ref: "../_common.yaml#/$defs/field_notes_and_images"
      properties:
        name:
          type: string
          title: 地點
          x-osm-list-i18n:
            title:
              en: Place
              ja: 場所
        place_type:
          type: string
          title: 類型
          x-osm-list-hidden: true
          x-osm-icon:
            神社: ⛩️
            寺院: 🛕
            教堂: ⛪
            車站: 🚉
            平交道: 🛤️
            學校: 🏫
            城: 🏯
            橋: 🌉
            水族館: 🐟
            博物館: 🏛️
            劇場: 🎭
            圖書館: 📚
            郵局: 📮
            露營地: 🏕️
            展望台: 🔭
            海岸: 🏖️
            公園: 🌳
            塔: 🗼
            球場: 🏟️
          x-osm-list-i18n:
            title:
              en: Type
              ja: 種別
        lat:
          type: number
          minimum: -90
          maximum: 90
        lon:
          type: number
          minimum: -180
          maximum: 180
        country:
          type: string
          title: 國家
          x-osm-list-i18n:
            title:
              en: Country
              ja: 国
