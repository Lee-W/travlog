version: 2
updates:
  -
    # Maintain dependencies for GitHub Actions
    package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    commit-message:
      prefix: "config: "
  -
    # Maintain uv-managed python dependencies
    package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    commit-message:
      prefix: "config: "
    groups:
      pelican-plugins:
        patterns:
          - "pelican-*"
  -
    # Maintain pre-commit hook revisions
    package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    commit-message:
      prefix: "config: "
